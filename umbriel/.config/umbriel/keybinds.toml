# ==============================================================================
# Keybinds
# Defining this table replaces the built-in bind set, so every active bind that
# should remain available is listed here.
# Syntax: https://docs.noctalia.dev/umbriel/keybinds/
# Actions: https://docs.noctalia.dev/umbriel/actions/
[keybinds]
"Mod+Ctrl+Slash" = { action = "cheatsheet-toggle", repeat = false }
# Screensharing
"Mod+Ctrl+P" = "screencast-set-window"
"Mod+Shift+P" = "screencast-set-output"

# Applications
"Mod+T" = { action = "spawn:foot", repeat = false }
"Mod+F1" = { action = "spawn:librewolf", repeat = false }
"Mod+F2" = { action = "spawn:thunar", repeat = false }

# Noctalia 
"Mod+Tab" = "spawn:noctalia msg panel-toggle launcher"
"Mod+Comma" = { action = "spawn:noctalia msg settings-toggle", repeat = false }
"Mod+Ctrl+V" = { action = "spawn:noctalia msg panel-toggle liamwh/emoji-picker:desktop", repeat = false }
"Mod+V" = "spawn:noctalia msg panel-toggle clipboard"
"Print" = "spawn:noctalia msg screenshot-region"
"Mod+Escape" = "spawn:noctalia msg panel-toggle session"

# Volume & brightness
"Mod+Period" = { action = "spawn:wpctl set-volume @DEFAULT_AUDIO_SOURCE@ $(wpctl get-volume @DEFAULT_AUDIO_SOURCE@ | awk '{print ($2<0.02?0.95:0.01)}')", repeat = false}
"XF86AudioRaiseVolume" = "spawn:noctalia msg volume-up 2" 
"XF86AudioLowerVolume" = "spawn:noctalia msg volume-down 2"
"XF86AudioMute" = { action = "spawn:noctalia msg volume-mute", repeat = false }
"XF86AudioPlay" = { action = "spawn:noctalia msg media toggle", repeat = false }
"XF86AudioStop" = { action = "spawn:noctalia msg media stop", repeat = false }
"XF86AudioNext" = { action = "spawn:noctalia msg media next", repeat = false }
"XF86AudioPrev" = { action = "spawn:noctalia msg media previous", repeat = false }
"XF86MonBrightnessUp" = "spawn:noctalia msg brightness-up 5"
"XF86MonBrightnessDown" = "spawn:noctalia msg brightness-down 5"

# Focus & movement
"Mod+W" = "window-focus-up"
"Mod+A" = "window-focus-left"
"Mod+S" = "window-focus-down"
"Mod+D" = "window-focus-right"

"Mod+Up" = "window-move-up"
"Mod+Left" = "window-consume-or-expel-left"
"Mod+Down" = "window-move-down"
"Mod+Right" = "window-consume-or-expel-right"

"Mod+Ctrl+W" = "window-focus-up"
"Mod+Ctrl+Left" = "column-move-left"
"Mod+Ctrl+S" = "window-focus-down"
"Mod+Ctrl+Right" = "column-move-right"

"Mod+Q" = { action = "window-close", repeat = false }
"Mod+F" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+Ctrl+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+R" = "window-cycle-primary-extent"

"Mod+WheelUp" = "window-focus-left"
"Mod+WheelDown" = "window-focus-right"
